# Databases for apps that need one (catalog "needs"). Start what you need:
#   docker compose -f services/compose.yml up -d mssql
# Bound to 127.0.0.1 only. The passwords are test-only values for throwaway containers.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Smoke_test_1234"
    ports: ["127.0.0.1:14330:1433"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "smoke"
    ports: ["127.0.0.1:33060:3306"]
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: "smoke"
    ports: ["127.0.0.1:54320:5432"]
