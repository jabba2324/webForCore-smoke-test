# Open-source ASP.NET 4.x applications to migrate to webForCore and smoke test.
#
# Fields:
#   id        folder name under apps/, overlays/<id>.patch and results/<id>.json
#   name      display name
#   repo      git URL
#   ref       pinned commit (preferred) or tag; the overlay is a patch on exactly this
#   site      the web project's folder, relative to the checkout (the folder with web.config)
#   project   the web project file, relative to the checkout (converted in place by the overlay)
#   kinds     webforms, mvc, webapi, webpages, owin, signalr, identity
#   licence   SPDX id or the project's own licence name
#   status    candidate   listed, not yet checked (repo, licence, framework, paths unverified)
#             verified    repo, ref, licence and paths checked; it's a .NET Framework ASP.NET app
#             migrating   overlay in progress
#             migrated    builds and passes its probes
#             blocked     needs something webForCore doesn't provide (see notes and results)
#             rejected    not a fit (not open source, not ASP.NET 4.x, ...); keep it listed so it isn't re-added
#   needs     services from services/compose.yml: mssql, mysql, postgres
#   env       extra environment for the server process
#   probes    [{ path, status = 200, contains = "text" }]; the first request compiles, so it gets 120 s
#   notes     anything the next person should know
#
# Every entry below starts as a candidate from memory. Check each before relying on it.

[[app]]
id = "eshop-legacy-mvc"
name = "eShopLegacyMVC (eShopModernizing)"
repo = "https://github.com/dotnet-architecture/eShopModernizing"
ref = ""
site = "eShopLegacyMVCSolution/src/eShopLegacyMVC"
project = "eShopLegacyMVCSolution/src/eShopLegacyMVC/eShopLegacyMVC.csproj"
kinds = ["mvc", "webapi"]
licence = "MIT"
status = "candidate"
notes = "Microsoft's reference legacy app. Has a mock-data mode (UseMockData in web.config) so it can run without SQL Server."

