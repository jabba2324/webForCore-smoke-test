# AspNetDocs: MvcMovie (Getting Started with MVC 5). Fields are described in README.md.

name = "AspNetDocs: MvcMovie (Getting Started with MVC 5)"
repo = "https://github.com/dotnet/AspNetDocs"
ref = "546ffe728556a60591b93ab4fcbd4437f71e2449"
site = "aspnet/mvc/overview/getting-started/introduction/sample/MvcMovie/MvcMovie"
project = "aspnet/mvc/overview/getting-started/introduction/sample/MvcMovie/MvcMovie/MvcMovie.csproj"
kinds = ["mvc", "owin", "identity"]
licence = "MIT"
status = "migrated"
notes = "webForCore 0.6.0: passes all 11 probes on Linux and Windows."

# The first request compiles the site, so it gets 120 s.
needs = ["mssql"]

[[probes]]
path = "/"
contains = "ASP.NET"

[[probes]]
path = "/Movies"
contains = "Create New"

[[probes]]
path = "/HelloWorld/Welcome?name=Scott&numTimes=4"
contains = "Scott"

[[probes]]
path = "/Account/Register"
contains = "__RequestVerificationToken"

[[probes]]
path = "/Content/Site.css"
contains = "body"
