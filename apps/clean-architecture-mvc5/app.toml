# Clean Architecture in ASP.NET MVC 5. Fields are described in README.md.

name = "Clean Architecture in ASP.NET MVC 5"
repo = "https://github.com/matthewrenze/clean-architecture-in-asp-net-mvc-5"
ref = "5cbeba34dd32db7212c8404e5451c7ba553b2829"
site = ""
project = "CleanArchitectureAspNetMvc5.csproj"
kinds = ["mvc"]
licence = "BSD-3-Clause"
status = "migrated"
notes = "webForCore 0.4.0: passes all 11 probes."

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/"
contains = "<h2>Home</h2>"

[[probes]]
path = "/Products"
contains = "Ice Cream"

[[probes]]
path = "/Products/Details/2"
contains = "Cake"

[[probes]]
path = "/Contact"
contains = "<h2>Contact</h2>"

# A view file requested directly: IIS refuses .cshtml when webpages:Enabled is false.
[[probes]]
path = "/Home/Views/Index.cshtml"
status = 404
