# ScrewTurn Wiki 3.0.4 (MarkZither's .NET 4.7.2 update). Fields are described in README.md.

name = "ScrewTurn Wiki 3.0"
repo = "https://github.com/MarkZither/ScrewTurnWiki"
# 24 Feb 2019: v3.0.4.560 retargeted to .NET Framework 4.7.2, before the fork replaced Anthem.NET with Syncfusion's
# (commercial) Essential JS controls.
ref = "7b1ccb462779d586f8beb8f37f78322e055149b6"
site = "WebApplication"
project = "WebApplication/WebApplication.csproj"
kinds = ["webforms"]
# The wiki rewrites its settings, log and search index (text files under public/) when it runs.
generated = ["WebApplication/public/Config.cs", "WebApplication/public/Log.cs", "WebApplication/public/Index*.cs"]
licence = "GPL-2.0"
status = "migrated"
notes = "webForCore 0.8.0 (.NET 10, under webforcore-host), webForCore-thirdparty 0.6.0: passes all probes, 24/24 on Linux and Windows (CI run 41900122122). A Windows-written page index needed `/` (F77)."

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/"
contains = "Main Page - ScrewTurn Wiki"

[[probes]]
path = "/MainPage.ashx"
contains = "Main Page - ScrewTurn Wiki"

# A page in a namespace: its file is under public/Pages/Dev/.
[[probes]]
path = "/Dev.MainPage.ashx"
contains = "main page of the namespace"

[[probes]]
path = "/AllPages.aspx"
contains = "Wiki Index - ScrewTurn Wiki"

[[probes]]
path = "/Category.aspx"
contains = "Categories - ScrewTurn Wiki"

[[probes]]
path = "/History.aspx?Page=MainPage"
contains = "Page History - ScrewTurn Wiki"

[[probes]]
path = "/Search.aspx?Query=wiki"
contains = "Search Engine - ScrewTurn Wiki"

[[probes]]
path = "/Search.aspx?OpenSearch=1"
contains = "<ShortName>ScrewTurn Wiki</ShortName>"

[[probes]]
path = "/RSS.aspx"
contains = "<rss version=\"2.0\""

# Forms: the log-in and registration pages (view state, event validation).
[[probes]]
path = "/Login.aspx"
contains = "ctl00$CphMasterSA$btnLogin"

[[probes]]
path = "/Register.aspx"
contains = "Create Account - ScrewTurn Wiki"

# Anonymous users are sent to the log-in page.
[[probes]]
path = "/Edit.aspx?Page=MainPage"
status = 302

# A CAPTCHA image drawn with System.Drawing.
[[probes]]
path = "/Captcha.aspx"
contains = "JFIF"

# Static files.
[[probes]]
path = "/Themes/Default/Screen_Styles.css"
contains = "body"

[[probes]]
path = "/JS/Scripts.js"
contains = "function"

# The wiki's data files (public/*.cs: users, settings) must not be served.
[[probes]]
path = "/public/Users.cs"
status = 404

[[probes]]
path = "/public/Config.cs"
status = 404

# Verbs: Web Forms postbacks, each with the view state and event validation of the page's GET before it (the probes
# share a cookie jar, for the session the log-in keeps). The administrator ("admin", web.config's MasterPassword)
# logs in, makes a page with the editor, edits it, starts a discussion on it, deletes it from the administration's
# Pages tab, and logs out. Registration isn't probed: it needs the CAPTCHA's text.
[[probes]]
path = "/Login.aspx"
cookies = true
contains = "ctl00$CphMasterSA$txtUsername"
capture = { viewstate = 'id="__VIEWSTATE" value="([^"]*)"', generator = 'id="__VIEWSTATEGENERATOR" value="([^"]*)"', validation = 'id="__EVENTVALIDATION" value="([^"]*)"' }

[[probes]]
path = "/Login.aspx"
method = "POST"
cookies = true
contains = "ctl00$CphMasterSA$btnLogin"
absent = "Administrator"
[probes.form]
__VIEWSTATE = "{viewstate}"
__VIEWSTATEGENERATOR = "{generator}"
__EVENTVALIDATION = "{validation}"
"ctl00$CphMasterSA$txtUsername" = "admin"
"ctl00$CphMasterSA$txtPassword" = "wrong"
"ctl00$CphMasterSA$btnLogin" = "Login"

[[probes]]
path = "/Login.aspx"
cookies = true
contains = "ctl00$CphMasterSA$txtUsername"
capture = { viewstate = 'id="__VIEWSTATE" value="([^"]*)"', generator = 'id="__VIEWSTATEGENERATOR" value="([^"]*)"', validation = 'id="__EVENTVALIDATION" value="([^"]*)"' }

[[probes]]
path = "/Login.aspx"
method = "POST"
cookies = true
status = 302
[probes.form]
__VIEWSTATE = "{viewstate}"
__VIEWSTATEGENERATOR = "{generator}"
__EVENTVALIDATION = "{validation}"
"ctl00$CphMasterSA$txtUsername" = "admin"
"ctl00$CphMasterSA$txtPassword" = "password"
"ctl00$CphMasterSA$btnLogin" = "Login"

[[probes]]
path = "/Edit.aspx?Page=SmokeProbe"
cookies = true
contains = "ctl00$CphMasterSA$editor$txtMarkup"
capture = { viewstate = 'id="__VIEWSTATE" value="([^"]*)"', generator = 'id="__VIEWSTATEGENERATOR" value="([^"]*)"', validation = 'id="__EVENTVALIDATION" value="([^"]*)"' }

[[probes]]
path = "/Edit.aspx?Page=SmokeProbe"
method = "POST"
cookies = true
status = 302
[probes.form]
__VIEWSTATE = "{viewstate}"
__VIEWSTATEGENERATOR = "{generator}"
__EVENTVALIDATION = "{validation}"
"ctl00$CphMasterSA$txtName" = "SmokeProbe"
"ctl00$CphMasterSA$txtTitle" = "Smoke Probe Page"
"ctl00$CphMasterSA$editor$txtMarkup" = "Written by a probe."
"ctl00$CphMasterSA$txtComment" = "Made by a probe"
"ctl00$CphMasterSA$btnSave" = "Save"

[[probes]]
path = "/SmokeProbe.ashx"
cookies = true
contains = "Written by a probe."

# An existing page's name can't be changed in the editor: its field isn't rendered, so it isn't posted.
[[probes]]
path = "/Edit.aspx?Page=SmokeProbe"
cookies = true
contains = "Written by a probe."
capture = { viewstate = 'id="__VIEWSTATE" value="([^"]*)"', generator = 'id="__VIEWSTATEGENERATOR" value="([^"]*)"', validation = 'id="__EVENTVALIDATION" value="([^"]*)"' }

[[probes]]
path = "/Edit.aspx?Page=SmokeProbe"
method = "POST"
cookies = true
status = 302
[probes.form]
__VIEWSTATE = "{viewstate}"
__VIEWSTATEGENERATOR = "{generator}"
__EVENTVALIDATION = "{validation}"
"ctl00$CphMasterSA$txtTitle" = "Smoke Probe Page"
"ctl00$CphMasterSA$editor$txtMarkup" = "Edited by a probe."
"ctl00$CphMasterSA$txtComment" = "Changed by a probe"
"ctl00$CphMasterSA$btnSave" = "Save"

[[probes]]
path = "/SmokeProbe.ashx"
cookies = true
contains = "Edited by a probe."

[[probes]]
path = "/History.aspx?Page=SmokeProbe"
cookies = true
contains = "Changed by a probe"

[[probes]]
path = "/Post.aspx?Page=SmokeProbe"
cookies = true
contains = "ctl00$CphMaster$txtSubject"
capture = { viewstate = 'id="__VIEWSTATE" value="([^"]*)"', generator = 'id="__VIEWSTATEGENERATOR" value="([^"]*)"', validation = 'id="__EVENTVALIDATION" value="([^"]*)"' }

[[probes]]
path = "/Post.aspx?Page=SmokeProbe"
method = "POST"
cookies = true
status = 302
[probes.form]
__VIEWSTATE = "{viewstate}"
__VIEWSTATEGENERATOR = "{generator}"
__EVENTVALIDATION = "{validation}"
"ctl00$CphMaster$txtSubject" = "A probe's question"
"ctl00$CphMaster$editor$txtMarkup" = "Discussed by a probe."
"ctl00$CphMaster$btnSend" = "Send"

[[probes]]
path = "/SmokeProbe.ashx?Discuss=1"
cookies = true
contains = "Discussed by a probe."

[[probes]]
path = "/AdminPages.aspx?Admin=SmokeProbe"
cookies = true
contains = "ctl00$cphAdmin$btnDeletePage"
capture = { viewstate = 'id="__VIEWSTATE" value="([^"]*)"', generator = 'id="__VIEWSTATEGENERATOR" value="([^"]*)"', validation = 'id="__EVENTVALIDATION" value="([^"]*)"' }

[[probes]]
path = "/AdminPages.aspx?Admin=SmokeProbe"
method = "POST"
cookies = true
contains = "ctl00$cphAdmin$rptPages"
[probes.form]
__VIEWSTATE = "{viewstate}"
__VIEWSTATEGENERATOR = "{generator}"
__EVENTVALIDATION = "{validation}"
"ctl00$cphAdmin$txtCurrentPage" = "SmokeProbe"
"ctl00$cphAdmin$btnDeletePage" = "Delete Page"

[[probes]]
path = "/SmokeProbe.ashx"
cookies = true
status = 302

[[probes]]
path = "/AllPages.aspx"
cookies = true
contains = "Wiki Index - ScrewTurn Wiki"
absent = "SmokeProbe"

# Logging out is the Logout button on the log-in page, which shows it to a user who's logged in.
[[probes]]
path = "/Login.aspx"
cookies = true
contains = "ctl00$CphMasterSA$btnLogout"
capture = { viewstate = 'id="__VIEWSTATE" value="([^"]*)"', generator = 'id="__VIEWSTATEGENERATOR" value="([^"]*)"', validation = 'id="__EVENTVALIDATION" value="([^"]*)"' }

[[probes]]
path = "/Login.aspx"
method = "POST"
cookies = true
status = 302
form = { __VIEWSTATE = "{viewstate}", __VIEWSTATEGENERATOR = "{generator}", __EVENTVALIDATION = "{validation}", "ctl00$CphMasterSA$btnLogout" = "Logout" }

[[probes]]
path = "/Edit.aspx?Page=MainPage"
cookies = true
status = 302
