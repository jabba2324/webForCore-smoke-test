# Umbraco 7. Fields are described in README.md.

name = "Umbraco 7"
repo = "https://github.com/umbraco/Umbraco-CMS"
# release-7.15.11, the last 7.x release.
ref = "bd60f4e2cea7ace2984dcfb8e61ef6512ea77c73"
site = "src/Umbraco.Web.UI"
project = "src/Umbraco.Web.UI/Umbraco.Web.UI.csproj"
# The build makes it from config/ClientDependency.Release.config, as the .NET Framework project did; Umbraco's
# installer rewrites its version.
generated = ["src/Umbraco.Web.UI/config/ClientDependency.config"]
kinds = ["webforms", "mvc", "webapi", "webpages", "owin", "identity", "signalr"]
licence = "MIT"
status = "migrated"
notes = "On webForCore 0.8.0 (.NET 10) with webForCore-thirdparty 0.6.0's webForCore.AutoMapperLegacy for AutoMapper 3.3.1 (F22), it builds, installs through [setup] (the installer's JSON API, a back-office log-in and a Web Forms create dialog) and passes 21/21 on Linux and Windows: the front end, the back office's MVC page and actions, Web API, SignalR, Web Forms, ASMX and ClientDependency. One mapping changed for F104 (webForCore-thirdparty#11); found F105 (ApplicationSettingsBase, webForCore#154), F65 and F66. The AngularJS client isn't built (Node 10-12 gulp 3), and no content is made (the API needs an XSRF header)."
needs = ["mssql"]

# web.Template.config has Umbraco's own empty connection string, so the site starts uninstalled and the installer's
# JSON API sets it up, as its AngularJS client does (NOTES.md, "Smoke"): GetSetup lists the steps, then each
# PostPerformInstall runs the next one, until the answer says it's complete. The install id is fixed: the steps are
# tracked in memory and in App_Data/TEMP/Install/install_<id>.txt, which the post after a restart reads (the database
# step writes the connection string to web.config, and others restart the application too). The database step gets
# the compose SQL Server, the User step the admin user, and the starter kit (from our.umbraco.org) is skipped with an
# empty id. A post caught by a restart fails and runs again.
[setup]
databases = ["umbraco7"]

[[setup.steps]]
get = "/install/api/GetSetup"
contains = "\"installId\""

[[setup.steps]]
post = "/install/api/PostPerformInstall"
json = '{"installId": "75b1e2f0-0000-4000-8000-000000000007", "instructions": {"DatabaseConfigure": {"dbType": "SqlServer", "server": "127.0.0.1,14330", "databaseName": "umbraco7", "login": "sa", "password": "Smoke_test_1234", "integratedAuth": false}, "User": {"name": "admin", "email": "admin@example.com", "password": "Smoke_test_1234", "subscribeToNewsLetter": false}, "StarterKitDownload": "00000000-0000-0000-0000-000000000000"}}'
timeout = 300
contains = "\"complete\":true"
retries = 30

# Then, in the back office: the log-in (the AngularJS client's JSON POST to the authentication API, which sets the
# back-office cookie and its UMB-XSRF-TOKEN cookie), the current user (Web API with that cookie), a stylesheet made
# with a legacy Web Forms create dialog (a postback; it writes css/Smoke.css), and the template and document type
# the probes' page uses (the back office's API, with the X-UMB-XSRF-TOKEN header its client sends).
[[setup.steps]]
post = "/umbraco/backoffice/UmbracoApi/Authentication/PostLogin"
json = '{"username": "admin@example.com", "password": "Smoke_test_1234"}'
contains = "\"name\":\"admin\""
retries = 4

[[setup.steps]]
get = "/umbraco/backoffice/UmbracoApi/Authentication/GetCurrentUser"
contains = "\"email\":\"admin@example.com\""

[[setup.steps]]
post = "/umbraco/create.aspx?nodeId=init&nodeType=initstylesheets&nodeName=Stylesheets&rnd=1"
button = "ctl00$body$ctl00$sbmt"
value = "Create"
fields = { "ctl00$body$ctl00$rename" = "Smoke" }
contains = "editStylesheet.aspx?id=Smoke.css"
capture = { xsrf = { cookie = "UMB-XSRF-TOKEN" } }

[[setup.steps]]
post = "/umbraco/backoffice/UmbracoApi/Template/PostSave"
headers = { X-UMB-XSRF-TOKEN = "{xsrf}" }
json = { id = 0, name = "Smoke Page", alias = "SmokePage", content = "@inherits Umbraco.Web.Mvc.UmbracoTemplatePage\n@{ Layout = null; }\n<!DOCTYPE html>\n<html><head><title>@Model.Content.Name</title></head><body><h1>Rendered by Umbraco 7: @Model.Content.Name</h1></body></html>\n" }
contains = "\"virtualPath\":\"/Views/SmokePage.cshtml\""

[[setup.steps]]
post = "/umbraco/backoffice/UmbracoApi/ContentType/PostSave"
headers = { X-UMB-XSRF-TOKEN = "{xsrf}" }
json = { id = 0, parentId = -1, alias = "smokePage", name = "Smoke Page", icon = "icon-document", thumbnail = "folder.png", description = "", allowAsRoot = true, allowedTemplates = ["SmokePage"], defaultTemplate = "SmokePage", groups = [], compositeContentTypes = [], allowedContentTypes = [], isContainer = false }
contains = "\"alias\":\"smokePage\""

# What the installed Umbraco 7 answers to an anonymous visitor. The first request compiles, so it gets 120 s.

# Umbraco's front end with no published content: its "no nodes" page (Web Forms).
[[probes]]
path = "/"
contains = "Welcome to your Umbraco installation"

# The back office's page (an MVC view; its AngularJS client isn't built, NOTES.md), with the server variables.
[[probes]]
path = "/umbraco/"
contains = "\"authenticationApiBaseUrl\":\"/umbraco/backoffice/UmbracoApi/Authentication/\""

# The installer, once installed, sends visitors to the back office.
[[probes]]
path = "/install/"
status = 302

# Web API: the authentication API (JSON, behind Angular's ")]}'," prefix), and a back-office API controller.
[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Authentication/IsAuthenticated"
contains = ")]}',\nfalse"

[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Section/GetSections"
status = 401
contains = "Authorization has been denied for this request."

# MVC: the back office's localized text action (JSON from umbraco/config/lang/en.xml) and its application script.
[[probes]]
path = "/umbraco/LocalizedText"
contains = "\"general_login\": \"Login\""

[[probes]]
path = "/umbraco/Application"
contains = "LazyLoad.js("

# SignalR: the back office's hubs proxy (preview).
[[probes]]
path = "/umbraco/BackOffice/signalr/hubs"
contains = "ASP.NET SignalR JavaScript Library"

# Web Forms.
[[probes]]
path = "/umbraco/ping.aspx"
contains = "I'm alive!"

# ASMX: a script service's help page and its ASP.NET AJAX client proxy.
[[probes]]
path = "/umbraco/webservices/legacyAjaxCalls.asmx"
contains = "legacyAjaxCalls Web Service"

[[probes]]
path = "/umbraco/webservices/CheckForUpgrade.asmx/js"
contains = "umbraco.presentation.webservices.CheckForUpgrade"

# ClientDependency's composite handler (an .axd in <handlers>), minifying /umbraco_client/modal/style.css.
[[probes]]
path = "/DependencyHandler.axd?s=L3VtYnJhY29fY2xpZW50L21vZGFsL3N0eWxlLmNzczs&t=Css&cdv=1"
contains = "umbModalBox"

# Static files: one of Umbraco's, and the stylesheet the setup's create dialog made.
[[probes]]
path = "/umbraco_client/modal/style.css"
contains = "div.umbModalBox"

[[probes]]
path = "/css/Smoke.css"

# The back office's API with verbs, as its AngularJS client calls it: the log-in (a JSON POST; its UMB-XSRF-TOKEN
# cookie captured, and sent back in the X-UMB-XSRF-TOKEN header from then on), a page saved and published without
# the header (refused: 417) and with it (the multipart post the content editor sends; its id captured), the page on
# the front end (Umbraco's MVC route, with setup's template), saved again with a new name, unpublished, deleted
# (DELETE, to the recycle bin) and the recycle bin emptied (DELETE), after which the page is gone. Umbraco's front end
# is back to its "no nodes" page, as the run found it.
[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Authentication/PostLogin"
method = "POST"
cookies = true
json = { username = "admin@example.com", password = "Smoke_test_1234" }
contains = "\"email\":\"admin@example.com\""
capture = { xsrf = { cookie = "UMB-XSRF-TOKEN" } }

[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Content/PostSave"
method = "POST"
cookies = true
status = 417
multipart = { contentItem = { id = 0, parentId = -1, name = "Smoke Probe Page", contentTypeAlias = "smokePage", templateAlias = "SmokePage", action = "publishNew", properties = [] } }

[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Content/PostSave"
method = "POST"
cookies = true
headers = { X-UMB-XSRF-TOKEN = "{xsrf}" }
multipart = { contentItem = { id = 0, parentId = -1, name = "Smoke Probe Page", contentTypeAlias = "smokePage", templateAlias = "SmokePage", action = "publishNew", properties = [] } }
contains = "\"published\":true"
capture = { page = '"id":(\d+),"udi":"umb://document/' }

[[probes]]
path = "/"
contains = "Rendered by Umbraco 7: Smoke Probe Page"

[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Content/PostSave"
method = "POST"
cookies = true
headers = { X-UMB-XSRF-TOKEN = "{xsrf}" }
multipart = { contentItem = { id = "{page}", parentId = -1, name = "Smoke Probe Page Edited", contentTypeAlias = "smokePage", templateAlias = "SmokePage", action = "publish", properties = [] } }
contains = "\"name\":\"Smoke Probe Page Edited\""

[[probes]]
path = "/"
contains = "Rendered by Umbraco 7: Smoke Probe Page Edited"

[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Content/PostUnPublish?id={page}"
method = "POST"
cookies = true
headers = { X-UMB-XSRF-TOKEN = "{xsrf}" }
contains = "\"published\":false"

[[probes]]
path = "/"
contains = "Welcome to your Umbraco installation"

[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Content/DeleteById?id={page}"
method = "DELETE"
cookies = true
headers = { X-UMB-XSRF-TOKEN = "{xsrf}" }

[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Content/GetById?id={page}"
cookies = true
headers = { X-UMB-XSRF-TOKEN = "{xsrf}" }
contains = "\"trashed\":true"

[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Content/EmptyRecycleBin"
method = "DELETE"
cookies = true
headers = { X-UMB-XSRF-TOKEN = "{xsrf}" }
contains = "The recycle bin is now empty"

[[probes]]
path = "/umbraco/backoffice/UmbracoApi/Content/GetById?id={page}"
cookies = true
headers = { X-UMB-XSRF-TOKEN = "{xsrf}" }
status = 404
