# IdentityServer3 example (Scott Brady), an OpenID Connect provider on Katana hosted in IIS. Fields are described in README.md.

name = "IdentityServer3 example"
repo = "https://github.com/scottbrady91/IdentityServer3-Example"
ref = "4c8103344e5d42a9ccd87f6f57921f3b1e5a4ce1"
site = "src/ScottBrady91.IdentityServer3.Example"
project = "src/ScottBrady91.IdentityServer3.Example/ScottBrady91.IdentityServer3.Example.csproj"
kinds = ["owin", "identity"]
licence = "MIT"
status = "blocked"
notes = "webForCore 0.9.0: builds; blocked: IdentityServer3 2.5 needs System.IdentityModel (WIF), which .NET lacks (F69, documented in 0.9.0). 7/11 on Linux and Windows (CI runs 42021158598 and 42026762740)."
# IdentityServer3 is configured with RequireSsl = true.
https = true

# The first request compiles the site, so it gets 120 s.
# OpenID Connect discovery.
[[probes]]
path = "/core/.well-known/openid-configuration"
contains = "\"authorization_endpoint\":\""

# The signing key, from the embedded test certificate.
[[probes]]
path = "/core/.well-known/jwks"
contains = "\"kty\":\"RSA\""

# An authorization request redirects to the log-in page.
[[probes]]
path = "/core/connect/authorize?client_id=implicitclient&response_type=id_token&scope=openid&redirect_uri=https%3A%2F%2Flocalhost%3A44304%2Faccount%2FsignInCallback&nonce=n1"
status = 302

# Verbs: the token endpoint (a form POST). The example's clients are implicit and hybrid only, so a token request
# from a client it doesn't know is OAuth 2.0's invalid_client (400). The log-in and consent forms need a sign-in
# message from the authorize redirect above and its anti-forgery token: they're reachable once the endpoints are.
[[probes]]
path = "/core/connect/token"
method = "POST"
form = { grant_type = "client_credentials", client_id = "smoke", client_secret = "smoke", scope = "openid" }
status = 400
contains = "\"error\":\"invalid_client\""
