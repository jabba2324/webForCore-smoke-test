# Orchard CMS 1.x. Fields are described in README.md.

name = "Orchard CMS 1.x"
repo = "https://github.com/OrchardCMS/Orchard"
# 1.10.4, the last 1.10.x release.
ref = "78ee4efb4f37b3ce75abd65692f64a7ea17e72e6"
site = "src/Orchard.Web"
project = "src/Orchard.Web/Orchard.Web.csproj"
# The framework, Core and the web project come with the web project; the 69 modules aren't referenced by it (Orchard
# loads them from Modules/<id>/bin), so they build from their own solution (NOTES.md, "Migration").
also_build = ["src/Orchard.WebForCore.slnx"]
kinds = ["mvc", "webapi"]
licence = "BSD-3-Clause"
status = "blocked"
notes = "On webForCore 0.8.0 it builds (framework, Core, all 69 modules; NHibernate 5, Castle.Core 4) and sets up its database, but on Linux it runs out of inotify instances (F97): one per watched folder, and Orchard watches every module's. F98-F101; F99 has a workaround in Global.asax. On Windows the setup recipe fails in the old NHibernate.Linq against NHibernate 5 (F100), so the tenant never initializes: 9/15 on both platforms."
needs = ["mssql"]

# Orchard's setup page (anonymous, so no anti-forgery token), with the compose SQL Server and the Core recipe: the
# Default recipe enables some 30 modules more. The setup answers with a redirect to /, which is 503 ("This tenant is
# currently initializing") while the recipe runs in the background, so that step may fail and the next one waits for
# the home page. Then the admin logs in and opens the dashboard.
[setup]
databases = ["orchard110"]

[[setup.steps]]
get = "/"
contains = "Get Started"
timeout = 300

[[setup.steps]]
post = "/"
fields = { "SiteName" = "Smoke Test", "AdminUsername" = "admin", "AdminPassword" = "Smoke_test_1234", "ConfirmPassword" = "Smoke_test_1234", "DatabaseProvider" = "SqlServer", "DatabaseConnectionString" = "Server=127.0.0.1,14330;Database=orchard110;User ID=sa;Password=Smoke_test_1234;TrustServerCertificate=True", "DatabaseTablePrefix" = "", "Recipe" = "Core" }
timeout = 600
may_fail = true

[[setup.steps]]
get = "/"
contains = "Welcome to Orchard!"
timeout = 300
retries = 36

[[setup.steps]]
post = "/Users/Account/LogOn"
fields = { "userNameOrEmail" = "admin", "password" = "Smoke_test_1234" }
timeout = 300

[[setup.steps]]
get = "/Admin"
contains = ">Logout<"
timeout = 300

# The first request compiles the site, so it gets 120 s.
# The home page: the Core recipe's page (Orchard.Pages, through Orchard.Autoroute's alias for /), in the SafeMode theme.
[[probes]]
path = "/"
contains = "Welcome to Orchard!"

# The same page at its own alias.
[[probes]]
path = "/welcome-to-orchard"
contains = "Welcome To Orchard!"

# A module's MVC page: Orchard.Users' log-on form (the admin log-in).
[[probes]]
path = "/Users/Account/LogOn"
contains = "name=\"userNameOrEmail\""

# The dashboard sends an anonymous visitor to log in.
[[probes]]
path = "/Admin"
status = 302

# A static file, from a theme folder whose web.config serves static files.
[[probes]]
path = "/Themes/SafeMode/Styles/site.css"
contains = "html, body, div, span"

# Not served: a module's assembly, its manifest, and the tenant's settings (the connection string).
[[probes]]
path = "/Modules/Orchard.Users/bin/Orchard.Users.dll"
status = 404

[[probes]]
path = "/Modules/Orchard.Users/Module.txt"
status = 404

[[probes]]
path = "/App_Data/Sites/Default/Settings.txt"
status = 404
