# ApplicantTracking. Fields are described in README.md.

name = "ApplicantTracking"
repo = "https://github.com/feliperomero3/ApplicantTracking"
ref = "ff9a2eb4b4f8fcf68efbab3b2f7857bb33ac307e"
site = "ApplicantTracking.Web"
project = "ApplicantTracking.Web/ApplicantTracking.Web.csproj"
kinds = ["mvc", "owin", "identity"]
licence = "Apache-2.0"
status = "migrated"
https = true
notes = "webForCore 0.9.0 (.NET 10, under webforcore-host): passes all probes, 18/18 on Linux and Windows (4 POSTs: validation and anti-forgery; saving hits the app's own keyless Domicilio). webForCore-thirdparty 0.7.0's WebActivatorEx."

needs = ["mssql"]

# The first request compiles the site, so it gets 120 s. Served over HTTPS (RequireHttpsAttribute is a global filter).
# Not probed: /Applicant and /Applicant/Details/{id}. At this commit the EF model has a Domicilio entity with no key, so
# any query fails model validation ("EntityType 'Domicilio' has no key defined"), as it would on .NET Framework.
[[probes]]
path = "/"
contains = "Getting started"

# A form with an anti-forgery token, from a controller Unity constructs.
[[probes]]
path = "/Applicant/Create"
contains = "__RequestVerificationToken"

[[probes]]
path = "/Account/Login"
contains = "Log in."

[[probes]]
path = "/Content/bootstrap.css"
contains = "Bootstrap"

# Verbs. Every form here saves through the context with the keyless Domicilio (above), so a post that reaches the
# database fails with the app's own model error, on .NET Framework too. What's probed is what the posts do before
# that: the anti-forgery check and the model binding and validation, each answered with the form and its messages.
[[probes]]
path = "/Applicant/Create"
cookies = true
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/Applicant/Create"
method = "POST"
cookies = true
form = { __RequestVerificationToken = "{token}", Nombre = "Smoke", ApellidoParterno = "Test", FechaNacimiento = "not a date" }
contains = "The value &#39;not a date&#39; is not valid for FechaNacimiento."

[[probes]]
path = "/Applicant/Create"
method = "POST"
form = { Nombre = "Smoke", ApellidoParterno = "Test" }
status = 500
contains = "__RequestVerificationToken"

[[probes]]
path = "/Account/Register"
cookies = true
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/Account/Register"
method = "POST"
cookies = true
form = { __RequestVerificationToken = "{token}", Email = "smoke@example.com", Password = "abc", ConfirmPassword = "abd" }
contains = "The Password must be at least 6 characters long."

[[probes]]
path = "/Account/Login"
cookies = true
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/Account/Login"
method = "POST"
cookies = true
form = { __RequestVerificationToken = "{token}", Email = "not-an-address", Password = "" }
contains = "The Password field is required."
