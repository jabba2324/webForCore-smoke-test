# ApplicantTracking. Fields are described in README.md.

name = "ApplicantTracking"
repo = "https://github.com/feliperomero3/ApplicantTracking"
ref = "ff9a2eb4b4f8fcf68efbab3b2f7857bb33ac307e"
site = "ApplicantTracking.Web"
project = "ApplicantTracking.Web/ApplicantTracking.Web.csproj"
kinds = ["mvc", "owin", "identity"]
licence = "Apache-2.0"
status = "migrated"
https = true
notes = "webForCore 0.6.0: passes all 10 probes on Linux and Windows (with webForCore-thirdparty 0.4.1's WebActivatorEx)."

needs = ["mssql"]

# The first request compiles the site, so it gets 120 s. Served over HTTPS (RequireHttpsAttribute is a global filter).
# Not probed: /Applicant and /Applicant/Details/{id}. At this commit the EF model has a Domicilio entity with no key, so
# any query fails model validation ("EntityType 'Domicilio' has no key defined"), as it would on .NET Framework.
[[probes]]
path = "/"
contains = "Getting started"

# A form with an anti-forgery token, from a controller Unity constructs.
[[probes]]
path = "/Applicant/Create"
contains = "__RequestVerificationToken"

[[probes]]
path = "/Account/Login"
contains = "Log in."

[[probes]]
path = "/Content/bootstrap.css"
contains = "Bootstrap"
