# AspNetDocs: MVCRandomAnswerGenerator (Docker tutorial). Fields are described in README.md.

name = "AspNetDocs: MVCRandomAnswerGenerator (Docker tutorial)"
repo = "https://github.com/dotnet/AspNetDocs"
ref = "546ffe728556a60591b93ab4fcbd4437f71e2449"
site = "aspnet/mvc/overview/deployment/docker-aspnetmvc/samples/MVCRandomAnswerGenerator/MVCRandomAnswerGenerator"
project = "aspnet/mvc/overview/deployment/docker-aspnetmvc/samples/MVCRandomAnswerGenerator/MVCRandomAnswerGenerator/MVCRandomAnswerGenerator.csproj"
kinds = ["mvc"]
licence = "MIT"
status = "migrated"
notes = "webForCore 0.9.0 (.NET 10, under webforcore-host): passes all probes, 13/13 on Linux and Windows (2 POSTs: the question form, with and without its token)."

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/"
contains = "Magic 8 ball"

[[probes]]
path = "/Home/About"
contains = "<h2>"

# Verbs: the question form (POST with its anti-forgery token), answered on the page it returns.
[[probes]]
path = "/"
cookies = true
contains = "Ask your question"
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/"
method = "POST"
cookies = true
form = { __RequestVerificationToken = "{token}", NextQuestion = "Will the smoke test pass?" }
contains = "Will the smoke test pass?"

# Without the token the post is refused (ValidateAntiForgeryToken), and the question isn't recorded.
[[probes]]
path = "/"
method = "POST"
form = { NextQuestion = "Smoke question without a token" }
status = 500
contains = "__RequestVerificationToken"

[[probes]]
path = "/"
absent = "Smoke question without a token"
