# ASP.NET samples: Katana HelloWorld. Fields are described in README.md.

name = "ASP.NET samples: Katana HelloWorld"
repo = "https://github.com/aspnet/samples"
ref = "f7d4a776327df09c13b39489b122209c5d04693b"
site = "samples/aspnet/Katana/HelloWorld"
project = "samples/aspnet/Katana/HelloWorld/HelloWorld.csproj"
kinds = ["owin"]
licence = "Apache-2.0"
status = "migrated"
notes = "webForCore 0.8.0 (.NET 10, under webforcore-host): passes all probes, 9/9 on Linux and Windows."

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/"
contains = "Hello World"

[[probes]]
path = "/any/path/at/all"
contains = "Hello World"

# Verbs: the app has no forms or API, but its OWIN pipeline answers every request, whatever the method, so a POST
# with a form body, a PUT with JSON and a DELETE must reach `app.Run` and get the same text.
[[probes]]
path = "/form"
method = "POST"
form = { name = "smoke", value = "1" }
contains = "Hello World"

[[probes]]
path = "/items/1"
method = "PUT"
json = { name = "smoke" }
contains = "Hello World"

[[probes]]
path = "/items/1"
method = "DELETE"
contains = "Hello World"
