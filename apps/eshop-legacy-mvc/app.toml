# eShopLegacyMVC (eShopModernizing). Fields are described in README.md.

name = "eShopLegacyMVC (eShopModernizing)"
repo = "https://github.com/dotnet-architecture/eShopModernizing"
ref = "63bc9ec4414d7e281dc9f9d7bdcf70030950457d"
site = "eShopLegacyMVCSolution/src/eShopLegacyMVC"
project = "eShopLegacyMVCSolution/src/eShopLegacyMVC/eShopLegacyMVC.csproj"
kinds = ["mvc", "webapi"]
licence = "MIT"
status = "migrated"
notes = "webForCore 0.8.0 (.NET 10, under webforcore-host): passes all probes, 26/26 on Linux and Windows (CI run 41940185337; Create, Edit and Delete posted with anti-forgery tokens; the CSS bundle is served unminified on both: WebGrease and Bootstrap 4's custom properties, as on .NET Framework)."

needs = ["mssql"]

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/"
contains = ".NET Bot Black Hoodie"

[[probes]]
path = "/Catalog/Details/1"
contains = ".NET Bot Black Hoodie"

[[probes]]
path = "/Catalog/Create"
contains = "__RequestVerificationToken"

[[probes]]
path = "/items/1/pic"

[[probes]]
path = "/api/brands"
contains = "\"Brand\":\"Azure\""

[[probes]]
path = "/api/brands/1"
contains = "Azure"

[[probes]]
path = "/Content/base.css"
contains = "Montserrat"

[[probes]]
path = "/Content/css"
contains = "esh-"

[[probes]]
path = "/Images/brand.png"

# MVC forms with anti-forgery tokens ([ValidateAntiForgeryToken]): each form's GET sets the token's cookie and puts
# the token in the form, captured for the post, which sends both (the probes share a cookie jar). An item created,
# found in the list (its id captured from its Edit link), edited, deleted, and gone; and a post without the token,
# which MVC refuses.
[[probes]]
path = "/Catalog/Create"
cookies = true
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/Catalog/Create"
method = "POST"
cookies = true
status = 302
form = { __RequestVerificationToken = "{token}", Name = "Smoke Test Hoodie", Description = "Made by a probe", CatalogBrandId = "2", CatalogTypeId = "2", Price = "12.50", AvailableStock = "5", RestockThreshold = "1", MaxStockThreshold = "10" }

[[probes]]
path = "/Catalog/Index?pageSize=100"
cookies = true
contains = "Made by a probe"
capture = { item = 'Smoke Test Hoodie[\s\S]*?/Catalog/Edit/(\d+)' }

[[probes]]
path = "/Catalog/Edit/{item}"
cookies = true
contains = "value=\"Smoke Test Hoodie\""
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/Catalog/Edit/{item}"
method = "POST"
cookies = true
status = 302
form = { __RequestVerificationToken = "{token}", Id = "{item}", Name = "Smoke Test Hoodie", Description = "Changed by a probe", CatalogBrandId = "2", CatalogTypeId = "2", Price = "15.75", PictureFileName = "dummy.png", AvailableStock = "5", RestockThreshold = "1", MaxStockThreshold = "10" }

[[probes]]
path = "/Catalog/Details/{item}"
cookies = true
contains = "Changed by a probe"

[[probes]]
path = "/Catalog/Delete/{item}"
cookies = true
contains = "Changed by a probe"
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/Catalog/Delete/{item}"
method = "POST"
cookies = true
status = 302
form = { __RequestVerificationToken = "{token}" }

[[probes]]
path = "/Catalog/Details/{item}"
cookies = true
status = 404

[[probes]]
path = "/Catalog/Create"
method = "POST"
status = 500
form = { Name = "No token" }
contains = "__RequestVerificationToken"

# Web API verbs: BrandsController has Get and Delete only. Its Delete answers 200 for a brand that exists and 404 for
# one that doesn't, and deletes nothing ("demo only"), so the brand is still listed after it; a POST, which it has no
# action for, is Web API's 405.
[[probes]]
path = "/api/brands/1"
method = "DELETE"
status = 200

[[probes]]
path = "/api/brands/99"
method = "DELETE"
status = 404

[[probes]]
path = "/api/brands/1"
contains = "\"Brand\":\"Azure\""

[[probes]]
path = "/api/brands"
method = "POST"
json = { Id = 9, Brand = "Smoke" }
status = 405
contains = "does not support http method 'POST'"
