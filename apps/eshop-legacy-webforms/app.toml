# eShopLegacyWebForms (eShopModernizing). Fields are described in README.md.

name = "eShopLegacyWebForms (eShopModernizing)"
repo = "https://github.com/dotnet-architecture/eShopModernizing"
ref = "63bc9ec4414d7e281dc9f9d7bdcf70030950457d"
site = "eShopLegacyWebFormsSolution/src/eShopLegacyWebForms"
project = "eShopLegacyWebFormsSolution/src/eShopLegacyWebForms/eShopLegacyWebForms.csproj"
kinds = ["webforms"]
licence = "MIT"
status = "blocked"
notes = "Build fails on webForCore bug F8 (HttpUtility CS0433); past it, F1 (session module) blocks every request and F9 (ItemType needs DynamicData) the home page. Postbacks work."

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/"
contains = ".NET Bot Black Hoodie"

[[probes]]
path = "/Default/index/1/size/10"
contains = "esh-table"

[[probes]]
path = "/Catalog/Details/1"
contains = ".NET Bot Black Hoodie"

[[probes]]
path = "/Catalog/Create"
contains = "__VIEWSTATE"

[[probes]]
path = "/About.aspx"
contains = "About"

[[probes]]
path = "/Content/site.css"
contains = "esh-"

[[probes]]
path = "/bundles/MsAjaxJs"
contains = "Sys"

[[probes]]
path = "/Pics/1.png"
