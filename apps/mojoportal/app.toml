# mojoPortal. Fields are described in README.md.

name = "mojoPortal"
repo = "https://github.com/i7MEDIA/mojoportal"
ref = "31b4fb1efd121dba2aab58af5ad6b0f30161259e"
site = "Web"
project = "Web/mojoPortal.Web.csproj"
# The features deploy themselves into Web (their post-build events, as MSBuild copies in the overlay).
also_build = ["mojoPortal.Features.Data.MSSQL/mojoPortal.Features.Data.MSSQL.csproj", "mojoPortal.Features.UI/mojoPortal.Features.UI.csproj"]
# Help files the features copy in; Setup deletes Data/test.config (its write-permission check).
generated = ["Web/Data/HelpFiles/**", "Web/Data/test.config"]
kinds = ["webforms", "mvc", "webapi"]
licence = "EPL-1.0"
status = "blocked"
notes = "On 0.5.0 it builds (F35 fixed) and every page fails on Assembly.Load(\"App_GlobalResources\") (F40, webForCore#33, 0.5.0's known issue). With optimizeCompilations=\"true\" (not in the overlay) Setup installs on SQL Server and all 15 checks pass. Features deploy via also_build."

# The first request compiles the site, so it gets 120 s. The probes need the compose SQL Server with an empty
# "mojoportal" database (see NOTES.md); the Setup page installs the schema and the default site on the first run.
[[probes]]
path = "/Setup/Default.aspx"
contains = "Your installation is up to date"

[[probes]]
path = "/"
contains = "Welcome to mojoPortal!"

# Web Forms with a login control (a form).
[[probes]]
path = "/Secure/Login.aspx"
contains = "LoginCtrl_Password"

[[probes]]
path = "/Secure/Register.aspx"
contains = "__VIEWSTATE"

# MVC (the file manager's controller).
[[probes]]
path = "/FileManager"
contains = "File Management"

# Web API: an [Authorize] controller answers with JSON.
[[probes]]
path = "/api/UserProfile/Property/FirstName"
status = 401
contains = "Authorization has been denied for this request."

# Generic handlers (.ashx).
[[probes]]
path = "/csshandler.ashx?s=1&skin=framework"
contains = "Bootstrap v3.3.7"

[[probes]]
path = "/SearchEngineInfo.ashx"
contains = "mojoPortal Site Search"

# A static file from the skin.
[[probes]]
path = "/Data/Sites/1/skins/framework/img/favicons/favicon-16x16.png"
