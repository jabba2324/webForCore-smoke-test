# Roadkill Wiki. Fields are described in README.md.

name = "Roadkill Wiki"
repo = "https://github.com/roadkillwiki/roadkill"
ref = "1061add4a727c55793234e0a92f146c6f1db62cf"
site = "src/Roadkill.Web"
project = "src/Roadkill.Web/Roadkill.Web.csproj"
kinds = ["mvc", "webapi", "owin"]
licence = "MS-PL"
status = "blocked"
notes = "Blocked on its closed-source LightSpeed ORM (AppDomain.DefineDynamicAssembly; F27), unchanged on webForCore 0.9.0: 9/10 probes on Linux. No verb probes: every form goes through LightSpeed. With webForCore-thirdparty 0.7.0's WebActivatorEx, StructureMap 4.7.1 (F25) and NLog 4.7."

# The first request compiles the site, so it gets 120 s.
needs = ["mssql"]

# The database is created from lib/Test-databases/roadkill-sqlserver.sql (NOTES.md). The first request compiles the
# site, so it gets 120 s. Blocked before any page renders, so the probes have no text checks yet.
# Its database, loaded from the app's own SQL Server script (NOTES.md, step 5).
[setup]
databases = ["Roadkill"]
sql_files = ["lib/Test-databases/roadkill-sqlserver.sql"]

[[probes]]
path = "/"

[[probes]]
path = "/User/Login"

[[probes]]
path = "/Assets/CSS/roadkill.css"
