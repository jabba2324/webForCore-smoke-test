# Kooboo CMS. Fields are described in README.md.

name = "Kooboo CMS"
repo = "https://github.com/Kooboo/CMS"
ref = "e5879728c817f37b275219636e7c24bf84a02830"
site = "Kooboo.CMS/Kooboo.CMS.Web"
project = "Kooboo.CMS/Kooboo.CMS.Web/Kooboo.CMS.Web.csproj"
# Logging in records the date in the admin user's file, which is in the repository.
generated = ["**/Cms_Data/Account/Users/admin.config"]
kinds = ["mvc"]
licence = "BSD-3-Clause"
status = "migrated"
notes = "Kooboo CMS 4.4 (MVC 4, .NET 4.0, file storage) on webForCore 0.9.0: builds, creates a site through [setup] and passes 40/40 on Linux and Windows (CI runs 42027500654, 42032474244), with verbs: an article created, edited and deleted through the back office's AJAX forms, a member registered, logged in and deleted. F90 and F91; F92 fixed in 0.9.0."

# Kooboo keeps its sites, content and users in files under Cms_Data. The setup logs in as the default admin
# (admin/admin) and creates a site, "sample", from the SampleSite template, with its content database and membership.
# Kooboo serves a site that has no domain bound under /dev~<site>/. On a second run the site already exists, so the
# creation may fail there; the probes show whether the site is there.
[setup]

[[setup.steps]]
post = "/Account/LogOn"
fields = { UserName = "admin", Password = "admin", RememberMe = "false" }
contains = "Site cluster"
timeout = 180

# The form posts by AJAX and gets JSON. The membership is the template's own: Kooboo 4.4 saves the site's membership
# back to the template's name after creating one under another name (NOTES.md).
[[setup.steps]]
post = "/Sites/Site/Create"
fields = { template = "SampleSite", Name = "sample", Repository = "sample", CreateNew = "true", Culture = "en-US", TimeZoneId = "UTC", Parent = "" }
contains = "\"Success\":true"
timeout = 300
may_fail = true

# A site created from a template has no search index: the back office's "Rebuild" (Contents > Search index) builds the
# Article folder's in a background thread, and the search page shows hits once it's done (5 s between tries).
[[setup.steps]]
post = "/Contents/SearchIndex/Rebuild?repositoryName=sample"
fields = { "model[0].FolderName" = "Article" }
contains = "\"Success\":true"

[[setup.steps]]
get = "/dev~sample/search?key=Lorem"
contains = "<strong class='highlight'>Lorem</strong> ipsum dolor sit amet 4"
retries = 12

# The first request compiles the site, so it gets 120 s. No site is bound to 127.0.0.1, so / goes to Kooboo's 404 page.
[[probes]]
path = "/"
status = 302

[[probes]]
path = "/kooboo-404"
contains = "Not Found - Kooboo CMS"

# The front site: pages rendered from Razor templates in Cms_Data, with content from the file-based repository.
[[probes]]
path = "/dev~sample/"
contains = "Lorem ipsum dolor sit amet 4"

[[probes]]
path = "/dev~sample/Articles/Detail/Lorem-ipsum-dolor-sit-amet-4"
contains = "<title>Lorem ipsum dolor sit amet 4 - Sample site</title>"

[[probes]]
path = "/dev~sample/Articles/Chrome"
contains = "<title>Articles - Sample site</title>"

[[probes]]
path = "/dev~sample/about"
contains = "<title>About us - Sample site</title>"

# Full-text search (Lucene.Net 2.9).
[[probes]]
path = "/dev~sample/search?key=Lorem"
contains = "<strong class='highlight'>Lorem</strong> ipsum dolor sit amet 4"

# Forms with anti-forgery tokens.
[[probes]]
path = "/dev~sample/Member/Login"
contains = "<title>Member login - Sample site</title>"

[[probes]]
path = "/dev~sample/Member/Register"
contains = "Kooboo-Submit/RegisterMember"

# The back office: the sign-in form (an MVC area) and a page behind it.
[[probes]]
path = "/Account/LogOn"
contains = "name=\"Password\""

[[probes]]
path = "/Sites/Home/Cluster"
status = 302

# Kooboo's own resource handlers: CSS and scripts combined from web.config's webResources.
[[probes]]
path = "/Account/WebResource?name=siteStyles&version=20140305"
contains = ".ui-helper-hidden"

[[probes]]
path = "/Kooboo-WebResource/Index/jQuery/20130227"
contains = "jQuery"

# Static files: the site's theme, an uploaded file, and one of the application's scripts.
[[probes]]
path = "/Cms_Data/Sites/sample/Themes/Default/common.css"
contains = "Main Container"

[[probes]]
path = "/Cms_Data/Sites/sample/Files/logo.png"
status = 200

[[probes]]
path = "/Scripts/less.js"
contains = "less"

# Verbs (round 0.9.0). The back office, as its AJAX forms post: the log-in, an article created in the sample site's
# Article folder (published), shown on the front end, edited, deleted, and gone (the sample's detail template throws
# for a missing article, so that probe checks only that the article's text is gone). Then the front end's member
# forms (each with its anti-forgery token): a member registers and logs in, and the back office deletes them. A run
# leaves the site as it found it.
[[probes]]
path = "/Account/LogOn"
method = "POST"
cookies = true
status = 302
form = { UserName = "admin", Password = "admin", RememberMe = "false" }

[[probes]]
path = "/Contents/TextContent/Create?siteName=sample&repositoryName=sample&folderName=Article"
method = "POST"
cookies = true
headers = { X-Requested-With = "XMLHttpRequest" }
form = { Title = "Smoke Probe Article", Summary = "Posted by the smoke test", Description = "<p>Smoke probe body</p>", Readings = "0", Published = "true", cat_Category_value = "", cat_Category_value_old = "" }
contains = "\"Success\":true"

[[probes]]
path = "/dev~sample/Articles/Detail/Smoke-Probe-Article"
contains = "<title>Smoke Probe Article - Sample site</title>"

[[probes]]
path = "/Contents/TextContent?siteName=sample&repositoryName=sample&folderName=Article"
cookies = true
contains = "Smoke Probe Article"
capture = { article = 'UserKey=Smoke-Probe-Article&amp;UUID=([^&"]+)' }

[[probes]]
path = "/Contents/TextContent/Edit?siteName=sample&repositoryName=sample&folderName=Article&UUID={article}"
method = "POST"
cookies = true
headers = { X-Requested-With = "XMLHttpRequest" }
form = { Title = "Smoke Probe Article", Summary = "Edited by the smoke test", Description = "<p>Smoke probe body, edited</p>", Readings = "0", Published = "true", cat_Category_value = "", cat_Category_value_old = "" }
contains = "\"Success\":true"

[[probes]]
path = "/dev~sample/Articles/Detail/Smoke-Probe-Article"
contains = "Smoke probe body, edited"

[[probes]]
path = "/Contents/TextContent/Delete?siteName=sample&repositoryName=sample&folderName=Article"
method = "POST"
cookies = true
headers = { X-Requested-With = "XMLHttpRequest" }
form = { docs = "{article}" }
contains = "\"Success\":true"

[[probes]]
path = "/dev~sample/Articles/Detail/Smoke-Probe-Article"
absent = "Smoke probe body"

[[probes]]
path = "/Contents/TextContent?siteName=sample&repositoryName=sample&folderName=Article"
cookies = true
absent = "Smoke-Probe-Article"

[[probes]]
path = "/dev~sample/Member/Register"
cookies = true
capture = { token = 'RegisterMember" method="post">\s*<input name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/dev~sample/Kooboo-Submit/RegisterMember"
method = "POST"
cookies = true
headers = { X-Requested-With = "XMLHttpRequest" }
form = { __RequestVerificationToken = "{token}", UserName = "smokemember", Email = "smokemember@example.com", Password = "Smoke_1234", ConfirmPassword = "Smoke_1234" }
contains = "\"Success\":true"

[[probes]]
path = "/dev~sample/Member/Login"
cookies = true
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/dev~sample/Kooboo-Submit/ValidateMember"
method = "POST"
cookies = true
headers = { X-Requested-With = "XMLHttpRequest" }
form = { __RequestVerificationToken = "{token}", UserName = "smokemember", Password = "Smoke_1234", RememberMe = "false" }
contains = "\"Model\":\"smokemember\""

[[probes]]
path = "/dev~sample/Member/Profile"
cookies = true
contains = "smokemember"

[[probes]]
path = "/Membership/MembershipUser?siteName=sample&membershipName=SampleSite"
cookies = true
contains = "smokemember"

[[probes]]
path = "/Membership/MembershipUser/Delete?siteName=sample&membershipName=SampleSite"
method = "POST"
cookies = true
headers = { X-Requested-With = "XMLHttpRequest" }
form = { "model[0].UUID" = "smokemember" }
contains = "\"Success\":true"

[[probes]]
path = "/Membership/MembershipUser?siteName=sample&membershipName=SampleSite"
cookies = true
absent = "smokemember"
