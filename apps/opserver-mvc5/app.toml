# Opserver (before its ASP.NET Core port). Fields are described in README.md.

name = "Opserver (before its ASP.NET Core port)"
repo = "https://github.com/opserver/Opserver"
ref = "ed57f51d26a061e75359c1a3245786b795ae93b7"
site = "Opserver"
project = "Opserver/Opserver.csproj"
kinds = ["mvc"]
licence = "MIT"
status = "migrated"
notes = "webForCore 0.8.0 (.NET 10, under webforcore-host): passes all probes, 11/11 on Linux and Windows. 0.8.0 builds System.Data.SqlClient with GetTypes() fixed (F47, webForCore#41), which failed one probe on 0.7.0 (10/11)."
needs = ["mssql"]

# The first request compiles the site, so it gets 120 s. Config/SecuritySettings.config (provider "alladmin", the
# example's "everyone") and Config/SQLSettings.json (the compose SQL Server) are in the overlay. Every page but the
# log-in page needs a log-in (a POST), so the probes see redirects there.
[[probes]]
path = "/login"
contains = "placeholder=\"Username\""

[[probes]]
path = "/"
status = 302

[[probes]]
path = "/dashboard"
status = 302

[[probes]]
path = "/Content/js/Scripts.js"
contains = "Status"
