# ReaLocate. Fields are described in README.md.

name = "ReaLocate"
repo = "https://github.com/MichaelaIvanova/ReaLocate"
ref = "0c2a3bd76c9fd2581ab993447e4fcdeef143197a"
site = "ReaLocate.Source/Web/ReaLocate.Web"
project = "ReaLocate.Source/Web/ReaLocate.Web/ReaLocate.Web.csproj"
kinds = ["mvc", "owin", "signalr", "identity"]
licence = "MIT"
status = "migrated"
notes = "webForCore 0.2.0: passes all 13 probes (Identity, OWIN cookies, EF 6 migrations, AutoMapper ProjectTo, SignalR hub proxy). Glimpse removed (F21), AutoMapper 4.2 -> 12 (F22)."

# The first request compiles the site, so it gets 120 s.
needs = ["mssql"]

# The first request compiles the site, so it gets 120 s. EF migrations create the database and seed the roles and the
# admin user. "/" isn't probed: Views/Home/Index.cshtml calls m.First() on the listings, which throws on an empty
# database (as on .NET Framework).
[[probes]]
path = "/Account/Login"
contains = "Log in - My ASP.NET Application"

[[probes]]
path = "/Account/Register"
contains = "Register - My ASP.NET Application"

# The paged listing: EF 6 query projected with AutoMapper's ProjectTo.
[[probes]]
path = "/Home/GetAllRealEstatesList"
contains = "ReaLocate Home Page"

# [Authorize] controller: OWIN cookie authentication redirects to the log-in page.
[[probes]]
path = "/Agencies/CreateAgency"
status = 302

[[probes]]
path = "/Home/Chat"
contains = "$.connection.chatHub"

# SignalR 2 generated hub proxy.
[[probes]]
path = "/signalr/hubs"
contains = "chatHub"

[[probes]]
path = "/Content/Site.css"
contains = "padding-top"
