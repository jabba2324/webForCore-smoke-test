# ASP.NET samples: Web API ActionResults. Fields are described in README.md.

name = "ASP.NET samples: Web API ActionResults"
repo = "https://github.com/aspnet/samples"
ref = "f7d4a776327df09c13b39489b122209c5d04693b"
site = "samples/aspnet/WebApi/ActionResults/ActionResults"
project = "samples/aspnet/WebApi/ActionResults/ActionResults/ActionResults.csproj"
kinds = ["webapi"]
licence = "Apache-2.0"
status = "migrated"
notes = "webForCore 0.8.0 (.NET 10, under webforcore-host): passes all probes, 11/11 on Linux and Windows."

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/text"
contains = "Hello, world!"

[[probes]]
path = "/file"
contains = "<"

[[probes]]
path = "/product/2"
contains = "Bar"

[[probes]]
path = "/product/99"
status = 404

# Verbs: every action is a GET (attribute routes on `Get...` methods), so other methods get Web API's own 405, and the
# product is still there after them.
[[probes]]
path = "/product/2"
method = "DELETE"
status = 405
contains = "does not support http method 'DELETE'"

[[probes]]
path = "/text"
method = "POST"
form = { text = "smoke" }
status = 405
contains = "does not support http method 'POST'"

[[probes]]
path = "/product/2"
contains = "Bar"
