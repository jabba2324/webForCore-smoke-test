# Rabbit: a WebMatrix (ASP.NET Web Pages 1) Starter Site with Yiyi Sun's Rabbit framework. Fields are described in
# README.md.

name = "Rabbit (WebMatrix Starter Site)"
repo = "https://github.com/yysun/Rabbit"
ref = "a819ee234c8cdb8b734f4e6e577f73517e7872a1"
site = "WebSite"
project = "WebSite/WebSite.csproj"
kinds = ["webpages"]
licence = "MIT"
status = "blocked"
notes = "webForCore 0.8.0 (.NET 10, under webforcore-host), webForCore-thirdparty 0.6.0, on SQL Server with Microsoft's WebMatrix.Data/WebData 3.2.9 (F78): 20/21 on Linux and Windows (CI run 41900122122). WebSecurity.RequireAuthenticatedUser gives anonymous users a 401, not the log-in redirect (F79)."

needs = ["mssql"]

# WebSecurity.InitializeDatabaseConnection(..., autoCreateTables: true) creates its tables in an existing database.
[setup]
databases = ["RabbitStarterSite"]

# An account through WebSecurity (SimpleMembership creates its tables in the new database), logged in after
# registering; its own Change Password page; then log out.
[[setup.steps]]
post = "/Account/Register"
fields = { email = "smoke@example.com", password = "Passw0rd!", confirmPassword = "Passw0rd!" }
contains = "smoke@example.com"

[[setup.steps]]
get = "/Account/ChangePassword"
contains = "Change Password Form"

[[setup.steps]]
get = "/Account/Logout"
contains = "Register"

# The first request compiles the site, so it gets 120 s.
# The home page redirects to the Pages module's home page.
[[probes]]
path = "/"
status = 302

[[probes]]
path = "/Pages"
contains = "<h2>Welcome to my Web Site!"

[[probes]]
path = "/Pages/About"
contains = "<h2>About My Site"

# The same page as JSON (Accept: application/json is the site's own switch) isn't probed: probes send no headers.
[[probes]]
path = "/Tags/home"
contains = "Welcome to my Web Site!"

# Forms.
[[probes]]
path = "/Account/Login"
contains = "name=\"username\""

[[probes]]
path = "/Account/Register"
contains = "name=\"confirmPassword\""

[[probes]]
path = "/Account/ForgotPassword"
contains = "Forget Your Password?"

# WebSecurity.RequireAuthenticatedUser() for an anonymous user: on IIS forms authentication turns its 401 into a
# 302 to the log-in page; webForCore sends the 401 (F79).
[[probes]]
path = "/Account/ChangePassword"
status = 302

[[probes]]
path = "/Rabbit-Admin/"
contains = "<h2>Module Admin"

[[probes]]
path = "/Rabbit-Admin/CodeGen"
contains = "<h2>Create New Module"

# Its unit test runner, which finds the test classes in App_Code by reflection.
[[probes]]
path = "/Rabbit-Admin/Test"
contains = "PageControllerTest"

[[probes]]
path = "/Templates/Sample1/Site.css"
contains = "body"

[[probes]]
path = "/robots.txt"
contains = "# WebMatrix 1.0"

# The site's data (JSON files in App_Data).
[[probes]]
path = "/App_Data/Rabbit/Site"
status = 404

# Verbs. The Pages module's forms and its in-place editor's AJAX save: a page made (POST /Pages/Create), shown, its
# editor (the Tags module's view, with its Razor 1 fix, F155), saved as the editor's jQuery post does it
# (X-Requested-With, Accept: application/json; Rabbit answers JSON), read back as JSON (Accept: application/json, the
# site's own switch), found by its tag, deleted (POST /Pages/Delete/<id>, the list's Delete link) and gone from the
# list. Then the account setup made: a failed log-in, a log-in, its password changed and changed back (so a second
# run logs in the same), and log-out.
[[probes]]
path = "/Pages/Create"
contains = "Create Page"

[[probes]]
path = "/Pages/Create"
method = "POST"
status = 302
form = { Title = "Smoke Probe Page", Content = "<p>Written by a probe</p>" }
capture = { page = { header = "Location", regex = "/Pages/(Smoke-Probe-Page)$" } }

[[probes]]
path = "/Pages/{page}"
contains = "Written by a probe"

[[probes]]
path = "/Pages/Edit/{page}"
contains = "id=\"article-tags\""

[[probes]]
path = "/Pages/Edit"
method = "POST"
headers = { X-Requested-With = "XMLHttpRequest", Accept = "application/json, text/javascript, */*; q=0.01" }
form = { Id = "{page}", OldId = "{page}", Title = "Smoke Probe Page", Content = "<p>Edited by a probe</p>", Tags = "smokeprobe, probe" }
contains = "{\"d\":[]}"

[[probes]]
path = "/Pages/{page}"
headers = { Accept = "application/json" }
contains = "\"Tags\":[\"smokeprobe\",\"probe\"]"

[[probes]]
path = "/Pages/{page}"
contains = "Edited by a probe"

[[probes]]
path = "/Tags/smokeprobe"
contains = "Smoke Probe Page"

[[probes]]
path = "/Pages/Delete/{page}"
method = "POST"
status = 302

[[probes]]
path = "/Pages/List"
contains = "/Pages/Edit/About"
absent = "Smoke-Probe-Page"

[[probes]]
path = "/Account/Login"
method = "POST"
cookies = true
form = { username = "smoke@example.com", password = "wrong" }
contains = "There was a problem with your login"

[[probes]]
path = "/Account/Login"
method = "POST"
cookies = true
status = 302
form = { username = "smoke@example.com", password = "Passw0rd!" }

[[probes]]
path = "/Account/ChangePassword"
method = "POST"
cookies = true
form = { currentPassword = "Passw0rd!", newPassword = "Passw0rd!2", confirmPassword = "Passw0rd!2" }
contains = "Your password has been updated!"

[[probes]]
path = "/Account/ChangePassword"
method = "POST"
cookies = true
form = { currentPassword = "Passw0rd!2", newPassword = "Passw0rd!", confirmPassword = "Passw0rd!" }
contains = "Your password has been updated!"

[[probes]]
path = "/Account/Logout"
cookies = true
status = 302

[[probes]]
path = "/Account/ChangePassword"
cookies = true
status = 302
