# FunnelWeb. Fields are described in README.md.

name = "FunnelWeb"
repo = "https://github.com/funnelweblog/FunnelWeb"
ref = "32f561e9bf991c141edd485905a6212ba194bd91"
site = "src/FunnelWeb.Web"
project = "src/FunnelWeb.Web/FunnelWeb.Web.csproj"
kinds = ["mvc"]
licence = "BSD-3-Clause"
status = "blocked"
notes = "Blocked on its NHibernate 3.3 (F39, app/environment): its installer, log-in and upgrade (MVC) work, 9/10 checks on 0.4.0 and 0.5.0; the blog's NHibernate proxies don't. Needs SQL Server."

# The first request compiles the site, so it gets 120 s. The probes need the compose SQL Server with a "FunnelWeb"
# database that FunnelWeb's upgrader has set up (log in as test/test, then /admin/install's "Upgrade"; NOTES.md).
# The blog: NHibernate 3.3's proxies don't work on .NET (F39, app/environment).
[[probes]]
path = "/"
contains = "My FunnelWeb Site"

# MVC (the Admin area's log-in form).
[[probes]]
path = "/admin/login"
contains = "To administer this site, log in using the form below."

# Forms authentication sends the installer to the log-in page.
[[probes]]
path = "/admin/install"
status = 302

# A static file.
[[probes]]
path = "/Content/Images/external.png"
