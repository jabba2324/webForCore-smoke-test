# FunnelWeb. Fields are described in README.md.

name = "FunnelWeb"
repo = "https://github.com/funnelweblog/FunnelWeb"
ref = "32f561e9bf991c141edd485905a6212ba194bd91"
site = "src/FunnelWeb.Web"
project = "src/FunnelWeb.Web/FunnelWeb.Web.csproj"
kinds = ["mvc"]
licence = "BSD-3-Clause"
status = "blocked"
notes = "Blocked on its NHibernate 3.3 (F39, app/environment): 12/16 on Linux and Windows on webForCore 0.9.0 (CI runs 42026922513 and 42030748535); the admin log-in after the home page fails with F39 too."
needs = ["mssql"]

# The first request compiles the site, so it gets 120 s. The probes need the compose SQL Server with a "FunnelWeb"
# database that FunnelWeb's upgrader has set up (log in as test/test, then /admin/install's "Upgrade"; NOTES.md).
# The blog: NHibernate 3.3's proxies don't work on .NET (F39, app/environment).
# An empty database, then FunnelWeb's upgrader: log in as test/test (My.config), then "Upgrade" (NOTES.md).
[setup]
databases = ["FunnelWeb"]

[[setup.steps]]
post = "/admin/login"
fields = { Username = "test", Password = "test", DatabaseIssue = "", ReturnUrl = "/admin/install" }

[[setup.steps]]
get = "/admin/install"

[[setup.steps]]
post = "/admin/install/upgrade"

[[probes]]
path = "/"
contains = "My FunnelWeb Site"

# MVC (the Admin area's log-in form).
[[probes]]
path = "/admin/login"
contains = "To administer this site, log in using the form below."

# Forms authentication sends the installer to the log-in page.
[[probes]]
path = "/admin/install"
status = 302

# A static file.
[[probes]]
path = "/Content/Images/external.png"

# Verbs (MVC forms; FunnelWeb's admin area has no anti-forgery tokens): a log-in with web.config's credentials, the
# installer as the logged-in admin, its upgrade posted again (nothing left to run), and log-out. Setup logs in the same
# way and works, but here the log-in comes after the home page, whose NHibernate session factory failed (F39), and
# the log-in fails with the same error (it builds the factory too): these probes fail with F39. A failed log-in and
# the blog's own forms (posts, comments, the wiki editor) need NHibernate's entities as well, so they aren't probed.
[[probes]]
path = "/admin/login"
method = "POST"
cookies = true
status = 302
form = { Username = "test", Password = "test", DatabaseIssue = "", ReturnUrl = "/admin/install" }

[[probes]]
path = "/admin/install"
cookies = true
contains = "Your database is up to date. No install is necessary."

[[probes]]
path = "/admin/install/upgrade"
method = "POST"
cookies = true
contains = "The upgrade completed successfully. 0 scripts were run."

[[probes]]
path = "/admin/logout"
cookies = true
status = 302

[[probes]]
path = "/admin/install"
cookies = true
status = 302
