# Subtext. Fields are described in README.md.

name = "Subtext"
repo = "https://github.com/haacked/Subtext"
ref = "87a2d90dae02022471cd52aa5f3004f778cc4c0b"
site = "src/Subtext.Web"
project = "src/Subtext.Web/SubText.Web.csproj"
# The search index Subtext writes at run time.
generated = ["src/Subtext.Web/App_Data/**"]
kinds = ["webforms", "mvc"]
licence = "MIT"
status = "blocked"
notes = "On webForCore 0.8.0 (.NET 10, under webforcore-host) it builds and the install wizard runs: 16/17 probes on Linux and Windows; the log-in page's DotNetOpenAuth fails (F44, app/environment). Uses webForCore-thirdparty 0.5.0's WebActivator."
needs = ["mssql"]

# The first request compiles the site, so it gets 120 s. The probes need the compose SQL Server with a "SubtextData"
# database that Subtext's install wizard has set up (three postbacks; NOTES.md): on an empty database every page
# redirects to /install/default.aspx.
# An empty database, then Subtext's install wizard: three postbacks (NOTES.md).
[setup]
databases = ["SubtextData"]

[[setup.steps]]
post = "/install/default.aspx"
button = "ctl00$Content$btnInstallClick"
value = "Install Now!"

[[setup.steps]]
post = "/install/Step02_ConfigureHost.aspx"
button = "ctl00$Content$btnSave"
value = "Save"
fields = { "ctl00$Content$txtUserName" = "smokeadmin", "ctl00$Content$txtEmail" = "admin@example.com", "ctl00$Content$txtPassword" = "Smoke_test_1234", "ctl00$Content$txtConfirmPassword" = "Smoke_test_1234" }

[[setup.steps]]
post = "/install/Step03_CreateBlog.aspx?email=admin%40example.com"
button = "ctl00$Content$btnQuickCreate"
value = "Quick Create"

[[probes]]
path = "/"
contains = "Welcome to Subtext!"

# A blog post (Subtext's URL routing to a Web Forms page). The welcome post's only URL carries the day the install
# wizard ran, which setup records.
[[probes]]
path = "/archive/{setup_date}/welcome-to-subtext.aspx"
contains = "Welcome to Subtext!"

[[probes]]
path = "/archives.aspx"
contains = "Archives"

# A form (the contact form, Web Forms).
[[probes]]
path = "/contact.aspx"
contains = "Contact Form"

# The log-in form: DotNetOpenAuth's OpenID control fails on .NET (F44, app/environment).
[[probes]]
path = "/login.aspx"
contains = "Sign In with OpenID"

# Forms authentication sends the admin pages to the log-in page.
[[probes]]
path = "/admin/default.aspx"
status = 302

# RSS (an IHttpHandler) and MVC controllers routed to .ashx URLs.
[[probes]]
path = "/rss.aspx"
contains = "<rss version=\"2.0\""

[[probes]]
path = "/wlwmanifest.xml.ashx"
contains = "<supportsSlug>Yes</supportsSlug>"

[[probes]]
path = "/opensearchdesc.xml.ashx"
contains = "OpenSearchDescription"

# A static file.
[[probes]]
path = "/css/lightbox.css"
contains = "#lightbox"

# Verbs. The log-in page fails (F44), so nothing behind it can be reached; the comment form needs its CAPTCHA's text,
# and the contact form sends e-mail. What can be posted: the search box (a postback that redirects to the search
# page), and the MetaWeblog API (XML-RPC over POST, as Windows Live Writer uses it; it checks the blog owner's name
# and password itself): a wrong password is a fault, a post made with newPost, its page, editPost, getPost with the
# change, a search that finds it (Subtext's Lucene.Net index), blogger.deletePost, and getPost's fault for it after.
# The post's own page isn't asked for after the edit or the delete: Subtext caches it.
[[probes]]
path = "/"
cookies = true
contains = "search$txtSearch"
capture = { viewstate = 'id="__VIEWSTATE" value="([^"]*)"', validation = 'id="__EVENTVALIDATION" value="([^"]*)"' }

[[probes]]
path = "/"
method = "POST"
cookies = true
status = 302
form = { __VIEWSTATE = "{viewstate}", __EVENTVALIDATION = "{validation}", "search$txtSearch" = "Welcome", "search$btnSearch" = "Search" }
capture = { search = { header = "Location", regex = "(/search\\.aspx\\?q=Welcome)$" } }

[[probes]]
path = "/services/metablogapi.aspx"
method = "POST"
content_type = "text/xml"
body = "<?xml version=\"1.0\"?><methodCall><methodName>metaWeblog.getRecentPosts</methodName><params><param><value><string>0</string></value></param><param><value><string>smokeadmin</string></value></param><param><value><string>wrong</string></value></param><param><value><i4>5</i4></value></param></params></methodCall>"
contains = "Username and password denied."

[[probes]]
path = "/services/metablogapi.aspx"
method = "POST"
content_type = "text/xml"
body = "<?xml version=\"1.0\"?><methodCall><methodName>metaWeblog.newPost</methodName><params><param><value><string>0</string></value></param><param><value><string>smokeadmin</string></value></param><param><value><string>Smoke_test_1234</string></value></param><param><value><struct><member><name>title</name><value><string>Smoke XML-RPC Post</string></value></member><member><name>description</name><value><string>Posted over XML-RPC</string></value></member></struct></value></param><param><value><boolean>1</boolean></value></param></params></methodCall>"
contains = "<methodResponse>"
capture = { post = '<string>(\d+)</string>' }

[[probes]]
path = "/services/metablogapi.aspx"
method = "POST"
content_type = "text/xml"
body = "<?xml version=\"1.0\"?><methodCall><methodName>metaWeblog.getPost</methodName><params><param><value><string>{post}</string></value></param><param><value><string>smokeadmin</string></value></param><param><value><string>Smoke_test_1234</string></value></param></params></methodCall>"
contains = "Posted over XML-RPC"
capture = { link = '<name>link</name>\s*<value>\s*<string>https?://[^/]+(/archive/[^<]+)</string>' }

[[probes]]
path = "{link}"
contains = "Posted over XML-RPC"

[[probes]]
path = "/services/metablogapi.aspx"
method = "POST"
content_type = "text/xml"
body = "<?xml version=\"1.0\"?><methodCall><methodName>metaWeblog.editPost</methodName><params><param><value><string>{post}</string></value></param><param><value><string>smokeadmin</string></value></param><param><value><string>Smoke_test_1234</string></value></param><param><value><struct><member><name>title</name><value><string>Smoke XML-RPC Post</string></value></member><member><name>description</name><value><string>Edited over XML-RPC</string></value></member></struct></value></param><param><value><boolean>1</boolean></value></param></params></methodCall>"
contains = "<boolean>1</boolean>"

[[probes]]
path = "/services/metablogapi.aspx"
method = "POST"
content_type = "text/xml"
body = "<?xml version=\"1.0\"?><methodCall><methodName>metaWeblog.getPost</methodName><params><param><value><string>{post}</string></value></param><param><value><string>smokeadmin</string></value></param><param><value><string>Smoke_test_1234</string></value></param></params></methodCall>"
contains = "Edited over XML-RPC"

[[probes]]
path = "/search.aspx?q=Smoke"
contains = "Smoke XML-RPC Post"

[[probes]]
path = "/services/metablogapi.aspx"
method = "POST"
content_type = "text/xml"
body = "<?xml version=\"1.0\"?><methodCall><methodName>blogger.deletePost</methodName><params><param><value><string>key</string></value></param><param><value><string>{post}</string></value></param><param><value><string>smokeadmin</string></value></param><param><value><string>Smoke_test_1234</string></value></param><param><value><boolean>1</boolean></value></param></params></methodCall>"
contains = "<boolean>1</boolean>"

[[probes]]
path = "/services/metablogapi.aspx"
method = "POST"
content_type = "text/xml"
body = "<?xml version=\"1.0\"?><methodCall><methodName>metaWeblog.getPost</methodName><params><param><value><string>{post}</string></value></param><param><value><string>smokeadmin</string></value></param><param><value><string>Smoke_test_1234</string></value></param></params></methodCall>"
contains = "The entry could not be found"
