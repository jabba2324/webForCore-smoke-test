# Subtext. Fields are described in README.md.

name = "Subtext"
repo = "https://github.com/haacked/Subtext"
ref = "87a2d90dae02022471cd52aa5f3004f778cc4c0b"
site = "src/Subtext.Web"
project = "src/Subtext.Web/SubText.Web.csproj"
# The search index Subtext writes at run time.
generated = ["src/Subtext.Web/App_Data/**"]
kinds = ["webforms", "mvc"]
licence = "MIT"
status = "blocked"
notes = "On 0.6.0 (Linux and Windows) it builds and the install wizard runs: 15/16 checks; the log-in page's DotNetOpenAuth fails (F44, app/environment). Uses webForCore-thirdparty's WebActivator."

# The first request compiles the site, so it gets 120 s. The probes need the compose SQL Server with a "SubtextData"
# database that Subtext's install wizard has set up (three postbacks; NOTES.md): on an empty database every page
# redirects to /install/default.aspx.
[[probes]]
path = "/"
contains = "Welcome to Subtext!"

# A blog post (Subtext's URL routing to a Web Forms page).
[[probes]]
path = "/archive/2026/11/01/welcome-to-subtext.aspx"
contains = "Welcome to Subtext!"

[[probes]]
path = "/archives.aspx"
contains = "Archives"

# A form (the contact form, Web Forms).
[[probes]]
path = "/contact.aspx"
contains = "Contact Form"

# The log-in form: DotNetOpenAuth's OpenID control fails on .NET (F44, app/environment).
[[probes]]
path = "/login.aspx"
contains = "Sign In with OpenID"

# Forms authentication sends the admin pages to the log-in page.
[[probes]]
path = "/admin/default.aspx"
status = 302

# RSS (an IHttpHandler) and MVC controllers routed to .ashx URLs.
[[probes]]
path = "/rss.aspx"
contains = "<rss version=\"2.0\""

[[probes]]
path = "/wlwmanifest.xml.ashx"
contains = "<supportsSlug>Yes</supportsSlug>"

[[probes]]
path = "/opensearchdesc.xml.ashx"
contains = "OpenSearchDescription"

# A static file.
[[probes]]
path = "/css/lightbox.css"
contains = "#lightbox"
