notes = "webForCore 0.2.0: passes all 10 probes with the round-1 overlay moved to the 0.2.0 packages."

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/api/products"
contains = "Tomato soup"

[[probes]]
path = "/api/products/2"
contains = "Yo-yo"

[[probes]]
path = "/api/products?category=Hardware"
contains = "Hammer"

[[probes]]
path = "/api/products/99"
status = 404
