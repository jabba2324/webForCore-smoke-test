# AspNetDocs: ProductsApp (Web API 2 tutorial). Fields are described in README.md.

name = "AspNetDocs: ProductsApp (Web API 2 tutorial)"
repo = "https://github.com/dotnet/AspNetDocs"
ref = "546ffe728556a60591b93ab4fcbd4437f71e2449"
site = "aspnet/web-api/overview/advanced/calling-a-web-api-from-a-net-client/sample/server/ProductsApp"
project = "aspnet/web-api/overview/advanced/calling-a-web-api-from-a-net-client/sample/server/ProductsApp/ProductsApp.csproj"
kinds = ["webapi"]
licence = "MIT"
status = "migrated"
notes = "webForCore 0.8.0 (.NET 10, under webforcore-host): passes all probes, 20/20 on Linux and Windows (CI run 41940185337), with the API's POST, PUT and DELETE."

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/api/products"
contains = "Tomato soup"

[[probes]]
path = "/api/products/2"
contains = "Yo-yo"

[[probes]]
path = "/api/products?category=Hardware"
contains = "Hammer"

[[probes]]
path = "/api/products/99"
status = 404

# Web API with verbs, on the in-memory repository: a product created (POST, JSON; 201 with its URL in Location, whose
# id the later probes use), read, changed (PUT), deleted (DELETE) and gone; then one posted as a form, which Web API
# binds the same way, and a PUT to a product that isn't there.
[[probes]]
path = "/api/products"
method = "POST"
json = { Name = "Smoke Gadget", Category = "Hardware", Price = 2.5 }
status = 201
contains = "\"Name\":\"Smoke Gadget\""
capture = { product = { header = "Location", regex = "/api/products/(\\d+)$" } }

[[probes]]
path = "/api/products/{product}"
contains = "\"Name\":\"Smoke Gadget\""

[[probes]]
path = "/api/products/{product}"
method = "PUT"
json = { Name = "Smoke Gadget II", Category = "Hardware", Price = 3.75 }
status = 204

[[probes]]
path = "/api/products/{product}"
contains = "\"Name\":\"Smoke Gadget II\",\"Category\":\"Hardware\",\"Price\":3.75"

[[probes]]
path = "/api/products?category=Hardware"
contains = "Smoke Gadget II"

[[probes]]
path = "/api/products/{product}"
method = "DELETE"
status = 204

[[probes]]
path = "/api/products/{product}"
status = 404

[[probes]]
path = "/api/products"
method = "POST"
form = { Name = "Smoke Form Gadget", Category = "Toys", Price = "1.25" }
status = 201
contains = "\"Name\":\"Smoke Form Gadget\""

[[probes]]
path = "/api/products/99"
method = "PUT"
json = { Name = "Nothing", Category = "Hardware", Price = 1 }
status = 404
