name = "AspNetDocs: ProductsApp (Web API 2 tutorial)"
repo = "https://github.com/dotnet/AspNetDocs"
ref = "546ffe728556a60591b93ab4fcbd4437f71e2449"
site = "aspnet/web-api/overview/advanced/calling-a-web-api-from-a-net-client/sample/server/ProductsApp"
