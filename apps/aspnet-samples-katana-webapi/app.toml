# ASP.NET samples: Katana Web API. Fields are described in README.md.

name = "ASP.NET samples: Katana Web API"
repo = "https://github.com/aspnet/samples"
ref = "f7d4a776327df09c13b39489b122209c5d04693b"
site = "samples/aspnet/Katana/WebApi"
project = "samples/aspnet/Katana/WebApi/WebApi.csproj"
kinds = ["webapi", "owin"]
licence = "Apache-2.0"
status = "migrated"
notes = "webForCore 0.9.0 (.NET 10, under webforcore-host): passes all probes, 12/12 on Linux and Windows (CI runs 42021158598 and 42026762740); the API is GET only (405 probes for POST and DELETE)."

# The first request compiles the site, so it gets 120 s.
[[probes]]
path = "/Customer/7"
contains = "<FirstName>Mary</FirstName>"

[[probes]]
path = "/Customer/7?$format=xml"

# Verbs: the API has only a GET (`CustomerController.Get`), so other methods are Web API's own 405, with the Allow
# header's message in the error body; the customer is still there after them.
[[probes]]
path = "/Customer/7"
method = "POST"
json = { ID = 8, LastName = "Smoke" }
status = 405
contains = "does not support http method 'POST'"

[[probes]]
path = "/Customer/7"
method = "DELETE"
status = 405
contains = "does not support http method 'DELETE'"

[[probes]]
path = "/Customer/7"
contains = "<FirstName>Mary</FirstName>"
