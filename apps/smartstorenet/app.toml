needs = ["mssql"]
notes = "webForCore 0.8.0: doesn't build. Its bundling is BundleTransformer, built against Microsoft's System.Web.Optimization 1.1.0.0, and webForCore's has another identity (F87, CS0012). Plugins not migrated yet."

# The first request compiles the site, so it gets 120 s. Until it builds, the probe is the home page.
[[probes]]
path = "/"
