# nopCommerce 3.90. Fields are described in README.md.

name = "nopCommerce 3.90"
repo = "https://github.com/nopSolutions/nopCommerce"
# The release-3.90 tag.
ref = "12d1f0139149a9d6e84964d325d62bae6ac748f6"
site = "src/Presentation/Nop.Web"
# The plugins build themselves into the site's Plugins folder, as in Visual Studio; Nop.Admin is a project reference
# of the web project (NOTES.md).
also_build = [
  "src/Plugins/Nop.Plugin.DiscountRules.CustomerRoles/Nop.Plugin.DiscountRules.CustomerRoles.csproj",
  "src/Plugins/Nop.Plugin.DiscountRules.HasOneProduct/Nop.Plugin.DiscountRules.HasOneProduct.csproj",
  "src/Plugins/Nop.Plugin.ExchangeRate.EcbExchange/Nop.Plugin.ExchangeRate.EcbExchange.csproj",
  "src/Plugins/Nop.Plugin.ExternalAuth.Facebook/Nop.Plugin.ExternalAuth.Facebook.csproj",
  "src/Plugins/Nop.Plugin.Feed.GoogleShopping/Nop.Plugin.Feed.GoogleShopping.csproj",
  "src/Plugins/Nop.Plugin.Payments.CheckMoneyOrder/Nop.Plugin.Payments.CheckMoneyOrder.csproj",
  "src/Plugins/Nop.Plugin.Payments.Manual/Nop.Plugin.Payments.Manual.csproj",
  "src/Plugins/Nop.Plugin.Payments.PayPalDirect/Nop.Plugin.Payments.PayPalDirect.csproj",
  "src/Plugins/Nop.Plugin.Payments.PayPalStandard/Nop.Plugin.Payments.PayPalStandard.csproj",
  "src/Plugins/Nop.Plugin.Payments.PurchaseOrder/Nop.Plugin.Payments.PurchaseOrder.csproj",
  "src/Plugins/Nop.Plugin.Pickup.PickupInStore/Nop.Plugin.Pickup.PickupInStore.csproj",
  "src/Plugins/Nop.Plugin.Shipping.AustraliaPost/Nop.Plugin.Shipping.AustraliaPost.csproj",
  "src/Plugins/Nop.Plugin.Shipping.CanadaPost/Nop.Plugin.Shipping.CanadaPost.csproj",
  "src/Plugins/Nop.Plugin.Shipping.Fedex/Nop.Plugin.Shipping.Fedex.csproj",
  "src/Plugins/Nop.Plugin.Shipping.FixedOrByWeight/Nop.Plugin.Shipping.FixedOrByWeight.csproj",
  "src/Plugins/Nop.Plugin.Shipping.UPS/Nop.Plugin.Shipping.UPS.csproj",
  "src/Plugins/Nop.Plugin.Shipping.USPS/Nop.Plugin.Shipping.USPS.csproj",
  "src/Plugins/Nop.Plugin.Tax.FixedOrByCountryStateZip/Nop.Plugin.Tax.FixedOrByCountryStateZip.csproj",
  "src/Plugins/Nop.Plugin.Widgets.GoogleAnalytics/Nop.Plugin.Widgets.GoogleAnalytics.csproj",
  "src/Plugins/Nop.Plugin.Widgets.NivoSlider/Nop.Plugin.Widgets.NivoSlider.csproj",
]
kinds = ["mvc"]
licence = "nopCommerce Public License 3.0 (GPL-3.0 with an attribution term)"
status = "blocked"
needs = ["mssql"]
notes = "Blocked: not every probe passes. webForCore 0.8.0 (.NET 10, under webforcore-host), with the administration and all 20 plugins: 22/23 on Linux (product thumbnails, F86), 23/23 on Windows in 2 of 5 runs, 7/23 in the others (F89). AutoMapper 12 (F22), LangVersion 7.3 (F83), DynamicDirectory (F84), System.Linq.Dynamic.Core (F85)."

# nopCommerce's install wizard: SQL Server, an existing (empty) database given as a connection string, with the
# sample data. It installs every plugin in the site's Plugins folder, then restarts the application.
[setup]
databases = ["nop390"]

[[setup.steps]]
get = "/install"
timeout = 300
contains = "nopCommerce installation"

# The install redirects to the home page across the restart, so its outcome is the next step's.
[[setup.steps]]
post = "/install"
timeout = 600
fields = { AdminEmail = "admin@yourStore.com", AdminPassword = "Smoke_test_1234", ConfirmPassword = "Smoke_test_1234", InstallSampleData = "true", DataProvider = "sqlserver", SqlServerCreateDatabase = "false", SqlConnectionInfo = "sqlconnectioninfo_raw", DatabaseConnectionString = "Data Source=127.0.0.1,14330;Initial Catalog=nop390;User ID=sa;Password=Smoke_test_1234;TrustServerCertificate=True", SqlAuthenticationType = "sqlauthentication", UseCustomCollation = "false", Collation = "SQL_Latin1_General_CP1_CI_AS" }
may_fail = true

[[setup.steps]]
get = "/"
timeout = 300
retries = 6
contains = "Your store"

# The first request compiles the site, so it gets 120 s. The sample data's categories and products, and the NivoSlider
# plugin's widget on the home page.
[[probes]]
path = "/"
contains = "nivoSlider"

[[probes]]
path = "/computers"
contains = "Your store. Computers"

[[probes]]
path = "/apple-macbook-pro-13-inch"
contains = "Apple MacBook Pro 13-inch"

[[probes]]
path = "/search?q=apple"
contains = "Apple MacBook Pro 13-inch"

[[probes]]
path = "/blog"
contains = "Your store. Blog"

# Forms.
[[probes]]
path = "/login"
contains = "Your store. Login"

[[probes]]
path = "/register"
contains = "Your store. Register"

[[probes]]
path = "/contactus"
contains = "Your store. Contact Us"

# RSS and the XML sitemap (MVC actions returning XML).
[[probes]]
path = "/news/rss/1"
contains = "<rss"

[[probes]]
path = "/sitemap.xml"
contains = "<urlset"

# nopCommerce's own 404 page.
[[probes]]
path = "/no-such-page"
status = 404
contains = "Page not found"

# The administration (Nop.Admin) needs a log-in.
[[probes]]
path = "/admin"
status = 302

# Static files: the theme's CSS, a plugin's content, and a product thumbnail at the URL nopCommerce writes
# (/content/images/thumbs/, the folder is Content/Images/Thumbs; F86: 404 on Linux until it's been requested in its
# own case).
[[probes]]
path = "/Themes/DefaultClean/Content/css/styles.css"
contains = ".header"

[[probes]]
path = "/Plugins/Widgets.NivoSlider/Content/nivoslider/nivo-slider.css"
contains = "nivoSlider"

[[probes]]
path = "/content/images/thumbs/0000020_build-your-own-computer_415.jpeg"

# A plugin's assembly isn't served (web.config's DenyAccessToPluginDLLs).
[[probes]]
path = "/Plugins/Widgets.NivoSlider/Nop.Plugin.Widgets.NivoSlider.dll"
status = 403

# Verbs (round 0.9.0). The shopping cart, anonymously: a product added from its page (the AJAX add-to-cart POST, with
# the quantity its form sends; the MacBook's minimum is 2), the cart showing it, and the item removed with the cart
# form's "update cart" post (the cart is then empty). Then the administration: the admin logs in (the log-in form),
# creates a category (the admin form, with its anti-forgery token, as every admin POST needs), finds it in the
# category grid (Kendo's AJAX POST, JSON), sees it on the front end at its SEO name, edits its description, and deletes
# it (it's then a 404). nopCommerce deletes a category by marking it deleted, and its old SEO name stays taken, so a
# second run's category gets a new one: the probes use the name the grid gives.
[[probes]]
path = "/addproducttocart/details/4/1"
method = "POST"
cookies = true
headers = { X-Requested-With = "XMLHttpRequest" }
form = { "addtocart_4.EnteredQuantity" = "2" }
contains = "\"success\":true"

[[probes]]
path = "/cart"
cookies = true
contains = "Apple MacBook Pro 13-inch"
capture = { item = 'name="removefromcart" value="(\d+)"' }

[[probes]]
path = "/cart"
method = "POST"
cookies = true
form = { removefromcart = "{item}", "itemquantity{item}" = "2", updatecart = "Update shopping cart" }
contains = "Your Shopping Cart is empty!"

[[probes]]
path = "/login"
method = "POST"
cookies = true
status = 302
form = { Email = "admin@yourStore.com", Password = "Smoke_test_1234", RememberMe = "false" }

[[probes]]
path = "/Admin/Category/Create"
cookies = true
contains = "id=\"category-form\""
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/Admin/Category/Create"
method = "POST"
cookies = true
status = 302
form = { __RequestVerificationToken = "{token}", Id = "0", Name = "Smoke Probe Category", Description = "Made by the smoke test", CategoryTemplateId = "1", ParentCategoryId = "0", PageSize = "6", AllowCustomersToSelectPageSize = "false", PageSizeOptions = "6, 3, 9", Published = "true", DisplayOrder = "0", PictureId = "0", save = "" }

[[probes]]
path = "/Admin/Category/List"
method = "POST"
cookies = true
headers = { X-Requested-With = "XMLHttpRequest" }
form = { __RequestVerificationToken = "{token}", page = "1", pageSize = "15", SearchCategoryName = "Smoke Probe Category" }
contains = "\"Name\":\"Smoke Probe Category\""
capture = { category = '"Breadcrumb":"Smoke Probe Category"[^}]*?"Id":(\d+)', sename = '"SeName":"([^"]+)"' }

[[probes]]
path = "/{sename}"
contains = "Made by the smoke test"

[[probes]]
path = "/Admin/Category/Edit/{category}"
cookies = true
contains = "Smoke Probe Category"
capture = { token = 'name="__RequestVerificationToken" type="hidden" value="([^"]+)"' }

[[probes]]
path = "/Admin/Category/Edit/{category}"
method = "POST"
cookies = true
status = 302
form = { __RequestVerificationToken = "{token}", Id = "{category}", Name = "Smoke Probe Category", Description = "Edited by the smoke test", CategoryTemplateId = "1", ParentCategoryId = "0", PageSize = "6", AllowCustomersToSelectPageSize = "false", PageSizeOptions = "6, 3, 9", Published = "true", DisplayOrder = "0", PictureId = "0", SeName = "{sename}", save = "" }

[[probes]]
path = "/{sename}"
contains = "Edited by the smoke test"

[[probes]]
path = "/Admin/Category/Delete/{category}"
method = "POST"
cookies = true
status = 302
form = { __RequestVerificationToken = "{token}" }

[[probes]]
path = "/{sename}"
status = 404

[[probes]]
path = "/logout"
cookies = true
status = 302
